<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Preencher documentos?</title>
  <style>
    :root { color-scheme: light dark; --fg: #1b1b1f; --muted: #5c5f66; --bg: #ffffff; --line: #d9dbe0; --accent: #1f5fbf; }
    @media (prefers-color-scheme: dark) { :root { --fg: #ececf1; --muted: #a4a7ae; --bg: #1c1d21; --line: #34363c; --accent: #6ea2ff; } }
    body { margin: 0; padding: 20px; font: 15px/1.45 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
    h1 { font-size: 18px; margin: 0 0 12px; }
    p { margin: 0 0 10px; }
    .muted { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
    .buttons { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
    button { font: inherit; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; text-align: left; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  </style>
</head>
<body>
  <h1>Preencher documentos?</h1>
  <p id="question">Carregando…</p>
  <p class="muted" id="where"></p>
  <p class="muted" id="title"></p>
  <p class="muted" id="note"></p>
  <div class="buttons" id="buttons"></div>
  <script src="confirm.js"></script>
</body>
</html>
