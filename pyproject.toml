[project]
name = "vagas"
version = "0.1.0"
description = "Servidor MCP local e Skill do Claude para organizar candidaturas a vagas e gerar currículos personalizados"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = ["mcp==2.3.0", "pydantic==2.14.1", "PyYAML==6.0.3", "typst==0.15.0", "pypdf==6.21.3"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "mcp[cli]==2.3.0"]
linkedin = ["playwright==1.64.1"]

[project.scripts]
vagas-server = "vagas.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vagas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
